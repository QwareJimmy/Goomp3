<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端音訊播放器</title>

  <!-- Tailwind CSS 預建完整版（相容 file:// 協議） -->
  <link rel="stylesheet" href="https://unpkg.com/tailwindcss@3.4.1/dist/tailwind.min.css" />

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone (JSX 轉換) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-in { animation: zoomIn 0.2s ease-out; }

    input[type="range"] { cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #3b82f6;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ─── Globals ───────────────────────────────────────────────────────────────
    const { useState, useEffect, useRef } = React;

    // ─── 內建 SVG 圖示元件（取代 lucide-react CDN）────────────────────────────
    const Svg = ({ size = 24, className = "", fill = "none", children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Play        = (p) => <Svg {...p}><polygon points="5 3 19 12 5 21 5 3"/></Svg>;
    const Pause       = (p) => <Svg {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Svg>;
    const SkipBack    = (p) => <Svg {...p}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></Svg>;
    const SkipForward = (p) => <Svg {...p}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></Svg>;
    const Volume2     = (p) => <Svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></Svg>;
    const Folder      = (p) => <Svg {...p}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></Svg>;
    const Music       = (p) => <Svg {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></Svg>;
    const ChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6"/></Svg>;
    const LogOut      = (p) => <Svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Svg>;
    const Plus        = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
    const ListMusic   = (p) => <Svg {...p}><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></Svg>;
    const Trash2      = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Svg>;
    const X           = (p) => <Svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Svg>;
    const AlertCircle = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></Svg>;
    const Save        = (p) => <Svg {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Svg>;

    // ─── 設定 ──────────────────────────────────────────────────────────────────
    const GOOGLE_CLIENT_ID = "562990807862-192e3nu1tbvra3cd4bfqan4tnah2tk6o.apps.googleusercontent.com"; // ★ 請填入您的 Google Cloud Client ID
    const DISCOVERY_DOC    = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
    const SCOPES           = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/drive.readonly";
    const CONFIG_FILENAME  = "audio_player_config.json";

    // ─── App 元件 ─────────────────────────────────────────────────────────────
    function App() {
      const [gdriveToken,    setGdriveToken]    = useState(null);
      const [configFileId,   setConfigFileId]   = useState(null);
      const [rootFolders,    setRootFolders]    = useState([]);
      const [selectedFolder, setSelectedFolder] = useState(null);
      const [files,          setFiles]          = useState([]);
      const [loading,        setLoading]        = useState(false);
      const [apiError,       setApiError]       = useState(null);
      const [isSaving,       setIsSaving]       = useState(false);

      // 播放器
      const [currentTrack, setCurrentTrack] = useState(null);
      const [isPlaying,    setIsPlaying]    = useState(false);
      const [progress,     setProgress]     = useState(0);
      const [volume,       setVolume]       = useState(0.8);
      const [queue,        setQueue]        = useState([]);
      const [currentIndex, setCurrentIndex] = useState(-1);

      // 播放列表
      const [playlists,              setPlaylists]              = useState([]);
      const [showPlaylistModal,      setShowPlaylistModal]      = useState(false);
      const [selectedFileForPlaylist,setSelectedFileForPlaylist]= useState(null);
      const [newPlaylistName,        setNewPlaylistName]        = useState("");
      const [viewingPlaylist,        setViewingPlaylist]        = useState(null);

      const audioRef       = useRef(null);
      const tokenClientRef = useRef(null);

      // ── 載入 Google API 腳本 ─────────────────────────────────────────────────
      useEffect(() => {
        function initGapi() {
          if (!window.gapi) return;
          window.gapi.load('client', async () => {
            try { await window.gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] }); }
            catch (e) { console.error("GAPI init error:", e); }
          });
        }

        function initGsi() {
          if (!window.google || !GOOGLE_CLIENT_ID) return;
          try {
            tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: SCOPES,
              callback: (res) => {
                if (res.error) { setApiError(`授權失敗: ${res.error}`); return; }
                setGdriveToken(res.access_token);
                initAppData(res.access_token);
              },
            });
          } catch (e) { console.error("GSI init error:", e); }
        }

        if (window.gapi && window.google) { initGapi(); initGsi(); return; }

        const gapiScript = document.createElement('script');
        gapiScript.src = 'https://apis.google.com/js/api.js';
        gapiScript.async = true;
        gapiScript.onload = initGapi;
        document.head.appendChild(gapiScript);

        const gsiScript = document.createElement('script');
        gsiScript.src = 'https://accounts.google.com/gsi/client';
        gsiScript.async = true;
        gsiScript.onload = initGsi;
        document.head.appendChild(gsiScript);
      }, []);

      // ── Google Drive 資料同步邏輯 ────────────────────────────────────────────

      const initAppData = async (token) => {
        setLoading(true);
        try {
          let fileId = await findConfigFile(token);
          let loadedPlaylists = [];
          if (fileId) {
            loadedPlaylists = await downloadConfigFile(fileId, token);
          } else {
            fileId = await createConfigFile(token);
          }
          setConfigFileId(fileId);
          setPlaylists(loadedPlaylists || []);
          await fetchRootFolders(token);
        } catch (err) {
          setApiError("初始化雲端數據時出錯。");
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const findConfigFile = async (token) => {
        const q = `name='${CONFIG_FILENAME}' and trashed=false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`,
          { headers: { Authorization: `Bearer ${token}` } }
        );
        const data = await res.json();
        return data.files && data.files.length > 0 ? data.files[0].id : null;
      };

      const downloadConfigFile = async (fileId, token) => {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          { headers: { Authorization: `Bearer ${token}` } }
        );
        if (res.status === 404) return [];
        try { return await res.json(); } catch (e) { return []; }
      };

      const createConfigFile = async (token) => {
        const res = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: CONFIG_FILENAME,
            mimeType: 'application/json',
            description: 'Audio Player Playlists Data'
          })
        });
        const file = await res.json();
        await uploadConfigContent(file.id, [], token);
        return file.id;
      };

      const uploadConfigContent = async (fileId, data, token = gdriveToken) => {
        setIsSaving(true);
        try {
          await fetch(
            `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
            {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }
          );
        } catch (e) {
          console.error("Save failed", e);
        } finally {
          setIsSaving(false);
        }
      };

      // ── 資料夾列表（下拉選單用） ─────────────────────────────────────────────
      const fetchRootFolders = async (token = gdriveToken) => {
        if (!token) return;
        try {
          const res  = await fetch(
            `https://www.googleapis.com/drive/v3/files?q='root' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'&fields=files(id,name)&orderBy=name`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          setRootFolders(data.files || []);
        } catch (err) {
          setApiError("無法讀取資料夾列表。");
        }
      };

      // ── 音訊檔案讀取 ─────────────────────────────────────────────────────────
      const fetchFiles = async (folderId, token = gdriveToken) => {
        if (!token) return;
        setLoading(true);
        try {
          const res  = await fetch(
            `https://www.googleapis.com/drive/v3/files?q='${folderId}' in parents and trashed = false&fields=files(id,name,mimeType,size,modifiedTime)`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          setFiles(data.files.filter(f => f.mimeType.startsWith('audio/') || /\.(mp3|wav|flac|m4a|ogg)$/i.test(f.name)));
        } catch (err) {
          setApiError("無法讀取雲端檔案。");
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = () => {
        if (!GOOGLE_CLIENT_ID) { setApiError("請先設定 GOOGLE_CLIENT_ID。"); return; }
        tokenClientRef.current?.requestAccessToken({ prompt: 'consent' });
      };

      const handleFolderSelect = (folder) => {
        setSelectedFolder(folder);
        setViewingPlaylist(null);
        setFiles([]);
        fetchFiles(folder.id);
      };

      // ── 播放邏輯 ─────────────────────────────────────────────────────────────
      const playTrack = (track, trackList = files) => {
        if (!gdriveToken) return;
        setCurrentTrack(track);
        setQueue(trackList);
        setCurrentIndex(trackList.findIndex(f => f.id === track.id));
        setIsPlaying(true);
        if (audioRef.current) {
          audioRef.current.src = `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media&access_token=${gdriveToken}`;
          audioRef.current.play().catch(e => console.error(e));
        }
      };

      const togglePlay = () => {
        if (!currentTrack || !audioRef.current) return;
        if (isPlaying) audioRef.current.pause();
        else audioRef.current.play().catch(console.error);
        setIsPlaying(!isPlaying);
      };

      const nextTrack = () => { if (currentIndex < queue.length - 1) playTrack(queue[currentIndex + 1], queue); };
      const prevTrack = () => { if (currentIndex > 0) playTrack(queue[currentIndex - 1], queue); };

      // ── 播放列表 CRUD（同步到 Drive） ────────────────────────────────────────
      const createPlaylist = async () => {
        if (!newPlaylistName.trim()) return;
        const newPlaylist = {
          id: Date.now().toString(),
          name: newPlaylistName,
          tracks: [],
          createdAt: new Date().toISOString()
        };
        const updated = [...playlists, newPlaylist];
        setPlaylists(updated);
        setNewPlaylistName("");
        await uploadConfigContent(configFileId, updated);
      };

      const addToPlaylist = async (playlistId, file) => {
        const updated = playlists.map(p =>
          p.id === playlistId
            ? { ...p, tracks: [...p.tracks, { id: file.id, name: file.name, mimeType: file.mimeType }] }
            : p
        );
        setPlaylists(updated);
        setShowPlaylistModal(false);
        await uploadConfigContent(configFileId, updated);
      };

      const removeFromPlaylist = async (playlistId, trackId) => {
        const updated = playlists.map(p =>
          p.id === playlistId ? { ...p, tracks: p.tracks.filter(t => t.id !== trackId) } : p
        );
        setPlaylists(updated);
        if (viewingPlaylist?.id === playlistId) setViewingPlaylist(updated.find(p => p.id === playlistId));
        await uploadConfigContent(configFileId, updated);
      };

      const deletePlaylist = async (id) => {
        const updated = playlists.filter(p => p.id !== id);
        setPlaylists(updated);
        if (viewingPlaylist?.id === id) setViewingPlaylist(null);
        await uploadConfigContent(configFileId, updated);
      };

      const formatTime = (time) => {
        if (isNaN(time) || !time) return "0:00";
        return `${Math.floor(time / 60)}:${String(Math.floor(time % 60)).padStart(2, '0')}`;
      };

      // ── 登入頁 ───────────────────────────────────────────────────────────────
      if (!gdriveToken) {
        return (
          <div className="flex flex-col items-center justify-center min-h-screen bg-slate-900 text-white p-4">
            <div className="bg-slate-800 p-8 rounded-3xl shadow-2xl flex flex-col items-center max-w-md w-full border border-slate-700">
              <Music size={48} className="text-blue-500 mb-6" />
              <h1 className="text-3xl font-bold mb-2">雲端播放器</h1>
              <p className="text-slate-400 text-center mb-8 text-sm">
                您的播放列表將以 <strong className="text-slate-200">{CONFIG_FILENAME}</strong> 儲存在您的 Google Drive 中。
              </p>

              {apiError && (
                <div className="text-red-400 text-xs mb-4 bg-red-400/10 p-3 rounded-lg w-full">{apiError}</div>
              )}

              <button
                onClick={handleLogin}
                className="w-full flex items-center justify-center gap-3 bg-white text-slate-900 px-6 py-4 rounded-xl font-bold hover:bg-slate-100 transition-all active:scale-95"
              >
                <img src="https://www.google.com/favicon.ico" className="w-5 h-5" alt="G" />
                連結 Google Drive
              </button>
            </div>
          </div>
        );
      }

      // ── 主頁面 ───────────────────────────────────────────────────────────────
      return (
        <div className="flex flex-col h-screen bg-slate-950 text-slate-100 overflow-hidden font-sans">

          {/* Header */}
          <header className="h-16 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/50 shrink-0">
            <div className="flex items-center gap-4">
              <Music className="text-blue-500" size={24} />
              <h2 className="text-lg font-bold tracking-tight">DrivePlayer</h2>
            </div>

            <div className="flex items-center gap-2 flex-1 max-w-xs mx-6">
              <Folder size={16} className="text-slate-500 shrink-0" />
              <select
                value={selectedFolder?.id || ""}
                onChange={e => {
                  const folder = rootFolders.find(f => f.id === e.target.value);
                  if (folder) handleFolderSelect(folder);
                }}
                style={{ backgroundColor: '#1e293b', color: '#f1f5f9', border: '1px solid #334155' }}
                className="text-sm rounded-lg px-3 py-1.5 w-full focus:outline-none"
              >
                <option value="">— 選擇資料夾 —</option>
                {rootFolders.map(f => (
                  <option key={f.id} value={f.id}>{f.name}</option>
                ))}
              </select>
            </div>

            <div className="flex items-center gap-4">
              {isSaving && (
                <div className="flex items-center gap-1.5 text-[10px] text-blue-400 animate-pulse">
                  <Save size={12} /> 同步中...
                </div>
              )}
              <button onClick={() => setGdriveToken(null)} className="p-2 text-slate-400 hover:text-red-400 transition">
                <LogOut size={20} />
              </button>
            </div>
          </header>

          <div className="flex flex-1 overflow-hidden">

            {/* Sidebar */}
            <aside className="w-64 border-r border-slate-800 bg-slate-900/20 overflow-y-auto hidden md:block p-4 shrink-0">
              <h3 className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-4 px-2">我的播放列表</h3>
              <div className="space-y-1">
                <div className="flex gap-1 px-2 mb-4">
                  <input
                    type="text"
                    placeholder="新列表"
                    className="bg-slate-800 rounded-md px-2 py-1.5 text-xs w-full focus:outline-none focus:ring-1 focus:ring-blue-500 text-white"
                    value={newPlaylistName}
                    onChange={e => setNewPlaylistName(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && createPlaylist()}
                  />
                  <button onClick={createPlaylist} className="bg-blue-600 p-1.5 rounded-md hover:bg-blue-500 transition shrink-0">
                    <Plus size={16} />
                  </button>
                </div>

                {playlists.map(pl => (
                  <div key={pl.id} className="group flex items-center justify-between hover:bg-slate-800 rounded-md transition">
                    <button
                      onClick={() => setViewingPlaylist(pl)}
                      className={`flex items-center gap-2 px-3 py-2 text-xs w-full text-left truncate ${viewingPlaylist?.id === pl.id ? 'text-blue-400 bg-blue-500/10' : 'text-slate-300'}`}
                    >
                      <ListMusic size={14} className="shrink-0" />
                      <span className="truncate">{pl.name}</span>
                    </button>
                    <button
                      onClick={() => deletePlaylist(pl.id)}
                      className="p-2 opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 transition shrink-0"
                    >
                      <Trash2 size={12} />
                    </button>
                  </div>
                ))}
              </div>
            </aside>

            {/* Main */}
            <main className="flex-1 overflow-y-auto p-6 bg-slate-950">
              {viewingPlaylist ? (
                /* 播放列表檢視 */
                <div className="max-w-4xl mx-auto">
                  <div className="flex items-center justify-between mb-8">
                    <div>
                      <h1 className="text-2xl font-bold mb-1">{viewingPlaylist.name}</h1>
                      <p className="text-xs text-slate-500">儲存在雲端設定檔中 • {viewingPlaylist.tracks.length} 首歌曲</p>
                    </div>
                    <button
                      onClick={() => viewingPlaylist.tracks.length > 0 && playTrack(viewingPlaylist.tracks[0], viewingPlaylist.tracks)}
                      disabled={viewingPlaylist.tracks.length === 0}
                      className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full text-sm font-bold shadow-lg disabled:opacity-50 transition"
                    >
                      播放全部
                    </button>
                  </div>

                  <div className="space-y-1">
                    {viewingPlaylist.tracks.length === 0 && (
                      <p className="text-slate-600 text-center py-16 text-sm">此播放列表是空的</p>
                    )}
                    {viewingPlaylist.tracks.map((t, i) => (
                      <div
                        key={t.id}
                        className="flex items-center justify-between p-2 rounded-lg hover:bg-slate-900 transition group cursor-pointer"
                        onClick={() => playTrack(t, viewingPlaylist.tracks)}
                      >
                        <div className="flex items-center gap-4 flex-1 min-w-0">
                          <span className="text-slate-600 text-[10px] w-4 text-center shrink-0">{i + 1}</span>
                          <Music size={14} className={currentTrack?.id === t.id ? 'text-blue-400 shrink-0' : 'text-slate-500 shrink-0'} />
                          <p className={`text-sm truncate ${currentTrack?.id === t.id ? 'text-blue-400 font-medium' : 'text-slate-300'}`}>{t.name}</p>
                        </div>
                        <button
                          onClick={e => { e.stopPropagation(); removeFromPlaylist(viewingPlaylist.id, t.id); }}
                          className="p-2 text-slate-500 hover:text-red-400 opacity-0 group-hover:opacity-100 transition shrink-0"
                        >
                          <Trash2 size={16} />
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

              ) : (
                /* 資料夾瀏覽 */
                <div className="max-w-6xl mx-auto">
                  {loading ? (
                    <div className="flex flex-col items-center justify-center h-64 gap-3">
                      <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                      <p className="text-slate-500 text-xs">讀取 Google Drive 檔案...</p>
                    </div>
                  ) : !selectedFolder ? (
                    <div className="flex flex-col items-center justify-center h-64 gap-3">
                      <Folder size={48} className="text-slate-700" />
                      <p className="text-slate-500 text-sm">請從上方下拉選單選擇一個資料夾</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                      {files.map(f => (
                        <div
                          key={f.id}
                          className="flex flex-col bg-slate-900/30 p-4 rounded-2xl border border-slate-800 hover:border-blue-500/30 transition group"
                        >
                          <div className="flex justify-between items-start mb-2">
                            <Music
                              size={20}
                              className={currentTrack?.id === f.id ? 'text-blue-400' : 'text-slate-600'}
                            />
                            <button
                              onClick={() => { setSelectedFileForPlaylist(f); setShowPlaylistModal(true); }}
                              className="text-slate-600 hover:text-white transition"
                              title="加入播放列表"
                            >
                              <Plus size={18} />
                            </button>
                          </div>
                          <h4 className={`text-xs font-medium truncate mb-4 ${currentTrack?.id === f.id ? 'text-blue-400' : ''}`}>{f.name}</h4>
                          <button
                            onClick={() => playTrack(f)}
                            className={`mt-auto text-[10px] py-1.5 rounded-lg font-bold transition ${currentTrack?.id === f.id ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}`}
                          >
                            {currentTrack?.id === f.id && isPlaying ? "暫停" : "播放"}
                          </button>
                        </div>
                      ))}

                      {files.length === 0 && (
                        <p className="col-span-full py-20 text-center text-slate-600 text-sm">此資料夾中沒有音訊檔案。</p>
                      )}
                    </div>
                  )}
                </div>
              )}
            </main>
          </div>

          {/* Player Footer */}
          <footer className="h-24 bg-slate-900 border-t border-slate-800 px-6 flex items-center gap-4 relative shrink-0">
            {/* Progress bar */}
            <div className="absolute top-0 left-0 w-full h-1 bg-slate-800 cursor-pointer">
              <input
                type="range" min="0" max="100" value={progress}
                onChange={e => {
                  if (!audioRef.current) return;
                  audioRef.current.currentTime = (e.target.value / 100) * audioRef.current.duration;
                  setProgress(e.target.value);
                }}
                className="absolute w-full h-1 opacity-0 z-10"
              />
              <div className="h-full bg-blue-600 pointer-events-none" style={{ width: `${progress}%` }} />
            </div>

            {/* Track info */}
            <div className="flex items-center gap-3 w-1/4 min-w-[120px]">
              <div className="w-10 h-10 rounded bg-slate-800 flex items-center justify-center shrink-0">
                <Music size={20} className={currentTrack ? "text-blue-500" : "text-slate-700"} />
              </div>
              <div className="min-w-0">
                <p className="text-xs font-bold truncate">{currentTrack?.name || "尚未選擇曲目"}</p>
                <p className="text-[10px] text-slate-500">{currentTrack ? (isPlaying ? "播放中" : "已暫停") : "—"}</p>
              </div>
            </div>

            {/* Controls */}
            <div className="flex flex-col items-center flex-1">
              <div className="flex items-center gap-6">
                <button onClick={prevTrack} className="text-slate-400 hover:text-white transition"><SkipBack size={20} /></button>
                <button
                  onClick={togglePlay}
                  className="w-10 h-10 rounded-full bg-white text-slate-950 flex items-center justify-center hover:scale-105 transition shadow-lg"
                >
                  {isPlaying
                    ? <Pause size={20} fill="currentColor" />
                    : <Play  size={20} fill="currentColor" className="ml-0.5" />}
                </button>
                <button onClick={nextTrack} className="text-slate-400 hover:text-white transition"><SkipForward size={20} /></button>
              </div>
              <div className="text-[9px] text-slate-600 mt-1 tabular-nums">
                {formatTime(audioRef.current?.currentTime)} / {formatTime(audioRef.current?.duration)}
              </div>
            </div>

            {/* Volume */}
            <div className="hidden sm:flex items-center gap-2 w-1/4 justify-end">
              <Volume2 size={16} className="text-slate-500 shrink-0" />
              <input
                type="range" min="0" max="1" step="0.01" value={volume}
                onChange={e => {
                  const v = parseFloat(e.target.value);
                  setVolume(v);
                  if (audioRef.current) audioRef.current.volume = v;
                }}
                className="w-20 h-1 accent-blue-500 bg-slate-800 rounded-full appearance-none"
              />
            </div>
          </footer>

          <audio
            ref={audioRef}
            onTimeUpdate={() => {
              const audio = audioRef.current;
              if (audio && !isNaN(audio.duration) && audio.duration > 0)
                setProgress((audio.currentTime / audio.duration) * 100);
            }}
            onEnded={nextTrack}
            className="hidden"
          />

          {/* 加入播放列表 Modal */}
          {showPlaylistModal && (
            <div
              className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50 p-4"
              onClick={e => e.target === e.currentTarget && setShowPlaylistModal(false)}
            >
              <div className="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl animate-in">
                <div className="p-4 border-b border-slate-800 flex justify-between items-center">
                  <div>
                    <h4 className="text-sm font-bold">加入列表</h4>
                    <p className="text-[10px] text-slate-500 mt-0.5 truncate max-w-[200px]">{selectedFileForPlaylist?.name}</p>
                  </div>
                  <button onClick={() => setShowPlaylistModal(false)} className="text-slate-400 hover:text-white transition">
                    <X size={18} />
                  </button>
                </div>
                <div className="max-h-64 overflow-y-auto p-2 space-y-1">
                  {playlists.map(p => (
                    <button
                      key={p.id}
                      onClick={() => addToPlaylist(p.id, selectedFileForPlaylist)}
                      className="w-full text-left p-3 hover:bg-blue-600 hover:text-white rounded-lg text-xs font-medium transition flex items-center gap-2"
                    >
                      <ListMusic size={14} className="shrink-0" />
                      <span className="truncate">{p.name}</span>
                    </button>
                  ))}
                  {playlists.length === 0 && (
                    <p className="text-center py-6 text-slate-500 text-[10px]">尚無列表，請先在側邊欄建立。</p>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
