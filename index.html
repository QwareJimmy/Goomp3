<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雲端音訊播放器</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <!-- iOS Safari 背景播放支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DrivePlayer" />

  <!-- Tailwind CSS 預建完整版（相容 file:// 協議） -->
  <link rel="stylesheet" href="https://unpkg.com/tailwindcss@3.4.1/dist/tailwind.min.css" />

  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel Standalone (JSX 轉換) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

  <style>
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }
    .animate-in { animation: zoomIn 0.2s ease-out; }

    @keyframes spin { to { transform: rotate(360deg); } }

    input[type="range"] { cursor: pointer; }

    /* Rotating album art */
    @keyframes vinyl-spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .album-spinning { animation: vinyl-spin 12s linear infinite; }

    /* Progress bar (indigo thumb) */
    .prog-bar {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 4px; border-radius: 2px;
      outline: none; cursor: pointer; display: block;
    }
    .prog-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px; height: 14px; border-radius: 50%;
      background: #6366f1; border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4); cursor: pointer;
    }
    .prog-bar::-moz-range-thumb {
      width: 14px; height: 14px; border-radius: 50%;
      background: #6366f1; border: 2px solid white; cursor: pointer;
    }

    /* Volume slider */
    .vol-bar {
      -webkit-appearance: none; appearance: none;
      width: 80px; height: 3px; border-radius: 2px;
      background: rgba(255,255,255,0.2); outline: none; cursor: pointer;
    }
    .vol-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px; height: 10px; border-radius: 50%;
      background: white; cursor: pointer;
    }

    /* Collapsible panel */
    .panel-wrap {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s cubic-bezier(0,1,0,1);
    }
    .panel-wrap.open {
      max-height: 340px;
      transition: max-height 0.45s cubic-bezier(1,0,1,0);
    }

    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.15); border-radius: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    // ─── Globals ───────────────────────────────────────────────────────────────
    const { useState, useEffect, useRef } = React;

    // ─── 內建 SVG 圖示元件（取代 lucide-react CDN）────────────────────────────
    const Svg = ({ size = 24, className = "", fill = "none", children }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
        fill={fill} stroke="currentColor" strokeWidth="2" strokeLinecap="round"
        strokeLinejoin="round" className={className}>{children}</svg>
    );
    const Play        = (p) => <Svg {...p}><polygon points="5 3 19 12 5 21 5 3"/></Svg>;
    const Pause       = (p) => <Svg {...p}><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></Svg>;
    const SkipBack    = (p) => <Svg {...p}><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></Svg>;
    const SkipForward = (p) => <Svg {...p}><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></Svg>;
    const Volume2     = (p) => <Svg {...p}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></Svg>;
    const Folder      = (p) => <Svg {...p}><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></Svg>;
    const Music       = (p) => <Svg {...p}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></Svg>;
    const ChevronRight = (p) => <Svg {...p}><polyline points="9 18 15 12 9 6"/></Svg>;
    const LogOut      = (p) => <Svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></Svg>;
    const Plus        = (p) => <Svg {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Svg>;
    const ListMusic   = (p) => <Svg {...p}><path d="M21 15V6"/><path d="M18.5 18a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/><path d="M12 12H3"/><path d="M16 6H3"/><path d="M12 18H3"/></Svg>;
    const Trash2      = (p) => <Svg {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></Svg>;
    const X           = (p) => <Svg {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></Svg>;
    const AlertCircle = (p) => <Svg {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12" y2="16"/></Svg>;
    const Save        = (p) => <Svg {...p}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></Svg>;

    // ─── 設定 ──────────────────────────────────────────────────────────────────
    const GOOGLE_CLIENT_ID = "562990807862-192e3nu1tbvra3cd4bfqan4tnah2tk6o.apps.googleusercontent.com"; // ★ 請填入您的 Google Cloud Client ID
    const DISCOVERY_DOC    = "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";
    const SCOPES           = "https://www.googleapis.com/auth/drive";
    const CONFIG_FILENAME  = "audio_player_config.json";

    // ─── App 元件 ─────────────────────────────────────────────────────────────
    function App() {
      const [gdriveToken,    setGdriveToken]    = useState(null);
      const [configFileId,   setConfigFileId]   = useState(null);
      const [rootFolders,    setRootFolders]    = useState([]);
      const [selectedFolder, setSelectedFolder] = useState(null);
      const [files,          setFiles]          = useState([]);
      const [loading,        setLoading]        = useState(false);
      const [apiError,       setApiError]       = useState(null);
      const [isSaving,       setIsSaving]       = useState(false);

      // 播放器
      const [currentTrack,    setCurrentTrack]    = useState(null);
      const [isPlaying,       setIsPlaying]       = useState(false);
      const [progress,        setProgress]        = useState(0);
      const [volume,          setVolume]          = useState(0.8);
      const [queue,           setQueue]           = useState([]);
      const [currentIndex,    setCurrentIndex]    = useState(-1);

      // 播放列表
      const [playlists,              setPlaylists]              = useState([]);
      const [showPlaylistModal,      setShowPlaylistModal]      = useState(false);
      const [selectedFileForPlaylist,setSelectedFileForPlaylist]= useState(null);
      const [newPlaylistName,        setNewPlaylistName]        = useState("");
      const [viewingPlaylist,        setViewingPlaylist]        = useState(null);

      // UI 面板狀態
      const [showPanel,       setShowPanel]       = useState(false);
      const [panelMode,       setPanelMode]       = useState('files'); // 'files' | 'playlists'
      const [showMenu,        setShowMenu]        = useState(false);
      const [showFolderMenu,  setShowFolderMenu]  = useState(false);
      const [showVolumeSlider,setShowVolumeSlider]= useState(false);

      // 播放模式：'none' | 'repeatAll' | 'repeatOne' | 'shuffle'
      const [playMode, setPlayMode] = useState('none');

      const audioRef        = useRef(null);
      const tokenClientRef  = useRef(null);
      // msRef 儲存最新的播放狀態，供 Media Session 回呼使用（避免 stale closure）
      const msRef           = useRef({});
      // ── 載入 Google API 腳本 ─────────────────────────────────────────────────
      useEffect(() => {
        function initGapi() {
          if (!window.gapi) return;
          window.gapi.load('client', async () => {
            try { await window.gapi.client.init({ discoveryDocs: [DISCOVERY_DOC] }); }
            catch (e) { console.error("GAPI init error:", e); }
          });
        }

        function initGsi() {
          if (!window.google || !GOOGLE_CLIENT_ID) return;
          try {
            tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
              client_id: GOOGLE_CLIENT_ID,
              scope: SCOPES,
              callback: (res) => {
                if (res.error) { setApiError(`授權失敗: ${res.error}`); return; }
                setGdriveToken(res.access_token);
                initAppData(res.access_token);
              },
            });
          } catch (e) { console.error("GSI init error:", e); }
        }

        if (window.gapi && window.google) { initGapi(); initGsi(); return; }

        const gapiScript = document.createElement('script');
        gapiScript.src = 'https://apis.google.com/js/api.js';
        gapiScript.async = true;
        gapiScript.onload = initGapi;
        document.head.appendChild(gapiScript);

        const gsiScript = document.createElement('script');
        gsiScript.src = 'https://accounts.google.com/gsi/client';
        gsiScript.async = true;
        gsiScript.onload = initGsi;
        document.head.appendChild(gsiScript);
      }, []);

      // ── Media Session API（iOS Safari 鎖定畫面控制）──────────────────────────
      useEffect(() => {
        if (!('mediaSession' in navigator)) return;
        const ms = navigator.mediaSession;
        const reg = (action, fn) => { try { ms.setActionHandler(action, fn); } catch (_) {} };

        reg('play',          async () => { try { await audioRef.current?.play(); setIsPlaying(true);  } catch (_) {} });
        reg('pause',               () => { audioRef.current?.pause(); setIsPlaying(false); });
        reg('nexttrack',           () => { const { idx, q, mode, pt } = msRef.current; if (!q?.length) return; if (mode === 'shuffle' && q.length > 1) { let r = idx; while (r === idx) r = Math.floor(Math.random() * q.length); pt(q[r], q); return; } if (idx < q.length - 1) pt(q[idx + 1], q); else if (mode === 'repeatAll') pt(q[0], q); });
        reg('previoustrack',       () => { const { idx, q, mode, pt } = msRef.current; if (!q?.length) return; if (mode === 'shuffle' && q.length > 1) { let r = idx; while (r === idx) r = Math.floor(Math.random() * q.length); pt(q[r], q); return; } if (idx > 0) pt(q[idx - 1], q); else if (mode === 'repeatAll') pt(q[q.length - 1], q); });
      }, []);

      // ── Google Drive 資料同步邏輯 ────────────────────────────────────────────

      const initAppData = async (token) => {
        setLoading(true);
        try {
          let fileId = await findConfigFile(token);
          let loadedPlaylists = [];
          if (fileId) {
            loadedPlaylists = await downloadConfigFile(fileId, token);
          } else {
            fileId = await createConfigFile(token);
          }
          setConfigFileId(fileId);
          setPlaylists(loadedPlaylists || []);
          await fetchRootFolders(token);
        } catch (err) {
          setApiError("初始化雲端數據時出錯。");
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const findConfigFile = async (token) => {
        const q = `name='${CONFIG_FILENAME}' and trashed=false`;
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}`,
          { headers: { Authorization: `Bearer ${token}` } }
        );
        const data = await res.json();
        return data.files && data.files.length > 0 ? data.files[0].id : null;
      };

      const downloadConfigFile = async (fileId, token) => {
        const res = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
          { headers: { Authorization: `Bearer ${token}` } }
        );
        if (res.status === 404) return [];
        try { return await res.json(); } catch (e) { return []; }
      };

      const createConfigFile = async (token) => {
        const res = await fetch('https://www.googleapis.com/drive/v3/files', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: CONFIG_FILENAME,
            mimeType: 'application/json',
            description: 'Audio Player Playlists Data'
          })
        });
        const file = await res.json();
        await uploadConfigContent(file.id, [], token);
        return file.id;
      };

      const uploadConfigContent = async (fileId, data, token = gdriveToken) => {
        setIsSaving(true);
        try {
          await fetch(
            `https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`,
            {
              method: 'PATCH',
              headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            }
          );
        } catch (e) {
          console.error("Save failed", e);
        } finally {
          setIsSaving(false);
        }
      };

      // ── 資料夾列表（下拉選單用） ─────────────────────────────────────────────
      const fetchRootFolders = async (token = gdriveToken) => {
        if (!token) return;
        try {
          const res  = await fetch(
            `https://www.googleapis.com/drive/v3/files?q='root' in parents and trashed=false and mimeType='application/vnd.google-apps.folder'&fields=files(id,name)&orderBy=name`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          setRootFolders(data.files || []);
        } catch (err) {
          setApiError("無法讀取資料夾列表。");
        }
      };

      // ── 音訊檔案讀取 ─────────────────────────────────────────────────────────
      const fetchFiles = async (folderId, token = gdriveToken) => {
        if (!token) return;
        setLoading(true);
        try {
          const res  = await fetch(
            `https://www.googleapis.com/drive/v3/files?q='${folderId}' in parents and trashed = false&fields=files(id,name,mimeType,size,modifiedTime)`,
            { headers: { Authorization: `Bearer ${token}` } }
          );
          const data = await res.json();
          if (data.error) throw new Error(data.error.message);
          setFiles(data.files.filter(f => f.mimeType.startsWith('audio/') || /\.(mp3|wav|flac|m4a|ogg)$/i.test(f.name)));
        } catch (err) {
          setApiError("無法讀取雲端檔案。");
        } finally {
          setLoading(false);
        }
      };

      const handleLogin = () => {
        if (!GOOGLE_CLIENT_ID) { setApiError("請先設定 GOOGLE_CLIENT_ID。"); return; }
        tokenClientRef.current?.requestAccessToken({ prompt: 'consent' });
      };

      const handleFolderSelect = (folder) => {
        setSelectedFolder(folder);
        setViewingPlaylist(null);
        setFiles([]);
        fetchFiles(folder.id);
      };

      // ── 播放邏輯 ─────────────────────────────────────────────────────────────
      const playTrack = async (track, trackList = files) => {
        if (!gdriveToken) return;

        // 停止並釋放前一個 blob URL
        if (audioRef.current) {
          audioRef.current.pause();
          if (audioRef.current.src.startsWith('blob:')) URL.revokeObjectURL(audioRef.current.src);
          audioRef.current.src = '';
        }
        setIsPlaying(false);
        setCurrentTrack(track);
        setQueue(trackList);
        setCurrentIndex(trackList.findIndex(f => f.id === track.id));
        setApiError(null);

        // 立即設定 Media Session metadata（在 fetch 之前，貼近使用者手勢）
        if ('mediaSession' in navigator) {
          try {
            navigator.mediaSession.metadata = new MediaMetadata({
              title: track.name.replace(/\.[^/.]+$/, ''),
              artist: 'Google Drive',
              album: selectedFolder?.name || 'DrivePlayer',
            });
          } catch (_) {}
        }

        try {
          const res = await fetch(
            `https://www.googleapis.com/drive/v3/files/${track.id}?alt=media`,
            { headers: { Authorization: `Bearer ${gdriveToken}` } }
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const blob = await res.blob();
          // 若 Drive 回傳 application/octet-stream，依副檔名補正 MIME type
          // 否則 Safari 無法辨識格式而拒絕播放
          let finalBlob = blob;
          if (!blob.type || blob.type === 'application/octet-stream' || blob.type === 'application/binary') {
            const ext = track.name.split('.').pop()?.toLowerCase();
            const mime = { mp3:'audio/mpeg', m4a:'audio/mp4', aac:'audio/aac', wav:'audio/wav', flac:'audio/flac', ogg:'audio/ogg', opus:'audio/ogg' }[ext] || 'audio/mpeg';
            finalBlob = blob.slice(0, blob.size, mime);
          }
          const blobUrl = URL.createObjectURL(finalBlob);

          const audio = audioRef.current;
          if (audio) {
            audio.src = blobUrl;
            audio.volume = volume;
            audio.load();
            await audio.play();
            setIsPlaying(true);
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
          }
        } catch (e) {
          console.error("Playback failed:", e);
          setApiError(`無法播放「${track.name}」：${e.message}`);
          setCurrentTrack(null);
        }
      };

      const togglePlay = async () => {
        if (!currentTrack || !audioRef.current || !audioRef.current.src) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          try {
            await audioRef.current.play();
            setIsPlaying(true);
          } catch (e) {
            console.error("Toggle play error:", e);
            setIsPlaying(false);
          }
        }
      };

      const nextTrack = (fromEnded = false) => {
        if (queue.length === 0) return;
        if (fromEnded && playMode === 'repeatOne') {
          if (audioRef.current) { audioRef.current.currentTime = 0; audioRef.current.play().catch(() => {}); }
          return;
        }
        if (playMode === 'shuffle') {
          let idx = currentIndex;
          if (queue.length > 1) while (idx === currentIndex) idx = Math.floor(Math.random() * queue.length);
          playTrack(queue[idx], queue);
          return;
        }
        if (currentIndex < queue.length - 1) playTrack(queue[currentIndex + 1], queue);
        else if (playMode === 'repeatAll') playTrack(queue[0], queue);
      };
      const prevTrack = () => {
        if (queue.length === 0) return;
        if (playMode === 'shuffle' && queue.length > 1) {
          let idx = currentIndex;
          while (idx === currentIndex) idx = Math.floor(Math.random() * queue.length);
          playTrack(queue[idx], queue); return;
        }
        if (currentIndex > 0) playTrack(queue[currentIndex - 1], queue);
        else if (playMode === 'repeatAll') playTrack(queue[queue.length - 1], queue);
      };

      // ── 播放列表 CRUD（同步到 Drive） ────────────────────────────────────────
      const createPlaylist = async () => {
        if (!newPlaylistName.trim()) return;
        const newPlaylist = {
          id: Date.now().toString(),
          name: newPlaylistName,
          tracks: [],
          createdAt: new Date().toISOString()
        };
        const updated = [...playlists, newPlaylist];
        setPlaylists(updated);
        setNewPlaylistName("");
        await uploadConfigContent(configFileId, updated);
      };

      const addToPlaylist = async (playlistId, file) => {
        const updated = playlists.map(p =>
          p.id === playlistId
            ? { ...p, tracks: [...p.tracks, { id: file.id, name: file.name, mimeType: file.mimeType }] }
            : p
        );
        setPlaylists(updated);
        setShowPlaylistModal(false);
        await uploadConfigContent(configFileId, updated);
      };

      const removeFromPlaylist = async (playlistId, trackId) => {
        const updated = playlists.map(p =>
          p.id === playlistId ? { ...p, tracks: p.tracks.filter(t => t.id !== trackId) } : p
        );
        setPlaylists(updated);
        if (viewingPlaylist?.id === playlistId) setViewingPlaylist(updated.find(p => p.id === playlistId));
        await uploadConfigContent(configFileId, updated);
      };

      const deletePlaylist = async (id) => {
        const updated = playlists.filter(p => p.id !== id);
        setPlaylists(updated);
        if (viewingPlaylist?.id === id) setViewingPlaylist(null);
        await uploadConfigContent(configFileId, updated);
      };

      const formatTime = (time) => {
        if (isNaN(time) || !time) return "0:00";
        return `${Math.floor(time / 60)}:${String(Math.floor(time % 60)).padStart(2, '0')}`;
      };

      // 每次 render 都更新 msRef，讓 Media Session 回呼拿到最新狀態
      msRef.current = { idx: currentIndex, q: queue, mode: playMode, pt: playTrack };

      // ── 登入頁 ───────────────────────────────────────────────────────────────
      if (!gdriveToken) {
        return (
          <div style={{
            minHeight: '100vh',
            background: 'linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%)',
            display: 'flex',
            flexDirection: 'column',
            alignItems: 'center',
            justifyContent: 'center',
            padding: '1.5rem',
            fontFamily: 'system-ui, sans-serif'
          }}>
            {/* 裝飾光暈 */}
            <div style={{
              position: 'absolute', width: '320px', height: '320px',
              background: 'radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%)',
              borderRadius: '50%', pointerEvents: 'none'
            }} />

            <div style={{
              position: 'relative', zIndex: 1,
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              width: '100%', maxWidth: '380px'
            }}>
              {/* 圖示 */}
              <div style={{
                width: '64px', height: '64px', borderRadius: '18px',
                background: 'linear-gradient(135deg, #3b82f6, #6366f1)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                marginBottom: '1.5rem',
                boxShadow: '0 8px 32px rgba(99,102,241,0.35)'
              }}>
                <Music size={30} className="text-white" />
              </div>

                        <button onClick={() => viewingPlaylist.tracks.length > 0 && playTrack(viewingPlaylist.tracks[0], viewingPlaylist.tracks)}
                          disabled={viewingPlaylist.tracks.length === 0}
                          style={{ padding: '0.3rem 0.75rem', borderRadius: '999px', fontSize: '11px', fontWeight: 600, background: '#6366f1', color: 'white', border: 'none', cursor: 'pointer', opacity: viewingPlaylist.tracks.length === 0 ? 0.4 : 1 }}
                        >播放全部</button>
                        <button onClick={() => setViewingPlaylist(null)}
                          style={{ background: 'rgba(255,255,255,0.08)', border: 'none', color: 'rgba(255,255,255,0.7)', borderRadius: '999px', padding: '0.3rem 0.625rem', cursor: 'pointer', fontSize: '11px' }}
                        >返回</button>
                      </div>
                    </div>
                    <div className="custom-scrollbar" style={{ overflowY: 'auto', maxHeight: '180px' }}>
                      {viewingPlaylist.tracks.length === 0 && <p style={{ fontSize: '11px', textAlign: 'center', opacity: 0.3, padding: '1.5rem 0' }}>此播放列表是空的</p>}
                      {viewingPlaylist.tracks.map((t, i) => {
                        const isActive = currentTrack?.id === t.id;
                        return (
                          <div key={t.id} onClick={() => playTrack(t, viewingPlaylist.tracks)}
                            style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.45rem 0.75rem', borderRadius: '0.75rem', cursor: 'pointer', background: isActive ? 'rgba(99,102,241,0.2)' : 'none', marginBottom: '2px', transition: 'background 0.1s' }}
                            onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = 'rgba(255,255,255,0.05)'; }}
                            onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = 'none'; }}
                          >
                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flex: 1, minWidth: 0 }}>
                              <span style={{ fontSize: '10px', fontFamily: 'monospace', opacity: 0.35, minWidth: '1.5rem', textAlign: 'right', flexShrink: 0 }}>{String(i+1).padStart(2,'0')}</span>
                              <span style={{ fontSize: '12px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: isActive ? '#a5b4fc' : 'rgba(255,255,255,0.8)', fontWeight: isActive ? 500 : 400 }}>{t.name}</span>
                            </div>
                            <button onClick={e => { e.stopPropagation(); removeFromPlaylist(viewingPlaylist.id, t.id); }}
                              style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.25)', cursor: 'pointer', padding: '0.2rem', flexShrink: 0 }}
                              onMouseEnter={e => e.currentTarget.style.color = '#f87171'}
                              onMouseLeave={e => e.currentTarget.style.color = 'rgba(255,255,255,0.25)'}
                            ><X size={13}/></button>
                          </div>
                        );
                      })}
                    </div>
                  </>

                ) : (
                  /* ── 音樂列表 (files) ── */
                  <>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
                      <h3 style={{ fontSize: '11px', fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', opacity: 0.4 }}>
                        {selectedFolder ? selectedFolder.name : '音樂列表'}
                      </h3>
                      <span style={{ fontSize: '10px', opacity: 0.35, fontFamily: 'monospace' }}>
                        {currentIndex >= 0 ? `${currentIndex+1} / ${queue.length}` : `0 / ${files.length}`}
                      </span>
                    </div>
                    {loading ? (
                      <div style={{ textAlign: 'center', padding: '1.5rem 0' }}>
                        <div style={{ width: 20, height: 20, border: '2px solid rgba(255,255,255,0.15)', borderTopColor: '#6366f1', borderRadius: '50%', animation: 'spin 0.8s linear infinite', margin: '0 auto' }} />
                      </div>
                    ) : files.length === 0 ? (
                      <p style={{ fontSize: '11px', textAlign: 'center', opacity: 0.3, padding: '1.5rem 0', fontStyle: 'italic' }}>
                        {selectedFolder ? '此資料夾中沒有音訊檔案' : '請從左上角選擇資料夾'}
                      </p>
                    ) : (
                      <div className="custom-scrollbar" style={{ overflowY: 'auto', maxHeight: '190px', display: 'flex', flexDirection: 'column', gap: '2px' }}>
                        {files.map((f, i) => {
                          const isActive = currentTrack?.id === f.id;
                          return (
                            <div key={f.id}
                              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0.45rem 0.75rem', borderRadius: '0.75rem', cursor: 'pointer', background: isActive ? 'rgba(99,102,241,0.22)' : 'none', transition: 'background 0.1s' }}
                              onMouseEnter={e => { if (!isActive) e.currentTarget.style.background = 'rgba(255,255,255,0.05)'; }}
                              onMouseLeave={e => { if (!isActive) e.currentTarget.style.background = isActive ? 'rgba(99,102,241,0.22)' : 'none'; }}
                              onClick={() => !isActive && playTrack(f, files)}
                            >
                              <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', flex: 1, minWidth: 0 }}>
                                <span style={{ fontSize: '10px', fontFamily: 'monospace', opacity: 0.35, minWidth: '1.5rem', textAlign: 'right', flexShrink: 0 }}>
                                  {isActive && isPlaying ? <span style={{ color: '#a5b4fc' }}>▶</span> : String(i+1).padStart(2,'0')}
                                </span>
                                <span style={{ fontSize: '12px', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', color: isActive ? '#a5b4fc' : 'rgba(255,255,255,0.8)', fontWeight: isActive ? 600 : 400 }}>{f.name}</span>
                              </div>
                              <div style={{ display: 'flex', gap: '0.25rem', flexShrink: 0, marginLeft: '0.375rem' }}>
                                {isActive && (
                                  <button onClick={e => { e.stopPropagation(); togglePlay(); }}
                                    style={{ padding: '0.2rem 0.5rem', borderRadius: '0.375rem', fontSize: '10px', fontWeight: 600, background: '#6366f1', color: 'white', border: 'none', cursor: 'pointer' }}
                                  >{isPlaying ? '暫停' : '播放'}</button>
                                )}
                                <button onClick={e => { e.stopPropagation(); setSelectedFileForPlaylist(f); setShowPlaylistModal(true); }}
                                  style={{ padding: '0.2rem 0.5rem', borderRadius: '0.375rem', fontSize: '10px', background: 'rgba(255,255,255,0.07)', color: 'rgba(255,255,255,0.45)', border: 'none', cursor: 'pointer', transition: 'all 0.1s' }}
                                  onMouseEnter={e => { e.currentTarget.style.background = 'rgba(99,102,241,0.2)'; e.currentTarget.style.color = '#a5b4fc'; }}
                                  onMouseLeave={e => { e.currentTarget.style.background = 'rgba(255,255,255,0.07)'; e.currentTarget.style.color = 'rgba(255,255,255,0.45)'; }}
                                >+列表</button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>

            {/* 錯誤訊息 */}
            {apiError && (
              <div style={{ marginTop: '0.75rem', padding: '0.625rem 0.875rem', borderRadius: '0.75rem', background: 'rgba(239,68,68,0.08)', border: '1px solid rgba(239,68,68,0.2)', color: '#fca5a5', fontSize: '11px', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                <AlertCircle size={13} style={{ flexShrink: 0 }} />
                <span style={{ flex: 1 }}>{apiError}</span>
                <button onClick={() => setApiError(null)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.35)', cursor: 'pointer', padding: '2px' }}><X size={12}/></button>
              </div>
            )}

          </div>

          {/* Hidden audio — playsInline 與 x-webkit-airplay 是 iOS Safari 背景播放必要設定 */}
          <audio ref={audioRef}
            playsInline
            x-webkit-airplay="allow"
            onTimeUpdate={() => {
              const a = audioRef.current;
              if (!a || isNaN(a.duration) || a.duration <= 0) return;
              setProgress((a.currentTime / a.duration) * 100);
              // 讓 iOS 鎖定畫面進度條保持更新
              if ('mediaSession' in navigator && 'setPositionState' in navigator.mediaSession) {
                try {
                  navigator.mediaSession.setPositionState({
                    duration: a.duration,
                    playbackRate: a.playbackRate,
                    position: a.currentTime,
                  });
                } catch (_) {}
              }
            }}
            onPlay={() => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; }}
            onPause={() => { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; }}
            onEnded={() => { if (audioRef.current?.src.startsWith('blob:') && playMode !== 'repeatOne') URL.revokeObjectURL(audioRef.current.src); nextTrack(true); }}
            style={{ display: 'none' }}
          />

          {/* 加入播放列表 Modal */}
          {showPlaylistModal && (
            <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.72)', backdropFilter: 'blur(4px)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, padding: '1rem' }}
              onClick={e => e.target === e.currentTarget && setShowPlaylistModal(false)}
            >
              <div style={{ background: '#0a1018', border: '1px solid rgba(255,255,255,0.1)', width: '100%', maxWidth: '320px', borderRadius: '1.5rem', overflow: 'hidden', boxShadow: '0 24px 64px rgba(0,0,0,0.6)', animation: 'zoomIn 0.2s ease-out' }}>
                <div style={{ padding: '1rem 1.25rem', borderBottom: '1px solid rgba(255,255,255,0.07)', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <h4 style={{ fontSize: '14px', fontWeight: 700, color: 'white', marginBottom: '0.25rem' }}>加入列表</h4>
                    <p style={{ fontSize: '11px', color: 'rgba(255,255,255,0.4)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '220px' }}>{selectedFileForPlaylist?.name}</p>
                  </div>
                  <button onClick={() => setShowPlaylistModal(false)} style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.4)', cursor: 'pointer' }}><X size={18}/></button>
                </div>
                <div className="custom-scrollbar" style={{ overflowY: 'auto', maxHeight: '256px', padding: '0.5rem' }}>
                  {playlists.map(p => (
                    <button key={p.id} onClick={() => addToPlaylist(p.id, selectedFileForPlaylist)}
                      style={{ width: '100%', textAlign: 'left', padding: '0.75rem', borderRadius: '0.75rem', fontSize: '12px', fontWeight: 500, color: 'rgba(255,255,255,0.8)', background: 'none', border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '0.625rem', transition: 'background 0.1s' }}
                      onMouseEnter={e => e.currentTarget.style.background = 'rgba(99,102,241,0.18)'}
                      onMouseLeave={e => e.currentTarget.style.background = 'none'}
                    >
                      <ListMusic size={14} style={{ flexShrink: 0, opacity: 0.55 }} />
                      <span style={{ overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.name}</span>
                    </button>
                  ))}
                  {playlists.length === 0 && (
                    <p style={{ textAlign: 'center', padding: '2rem 0', fontSize: '11px', color: 'rgba(255,255,255,0.3)' }}>尚無列表，請先從選單建立。</p>
                  )}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
